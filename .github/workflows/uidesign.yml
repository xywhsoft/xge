name: UIDesign

on:
  push:
    paths:
      - "apps/UIDesign/**"
      - "src/**"
      - "include/**"
      - "single/xge.c"
      - "extlibs/xrt/**"
      - "tools/build/xui_sources.bat"
      - "tools/build/build_dll.bat"
      - "config/**"
      - "docs/api-audit/**"
      - ".github/workflows/uidesign.yml"
  pull_request:
    paths:
      - "apps/UIDesign/**"
      - "src/**"
      - "include/**"
      - "single/xge.c"
      - "extlibs/xrt/**"
      - "tools/build/xui_sources.bat"
      - "tools/build/build_dll.bat"
      - "config/**"
      - "docs/api-audit/**"
      - ".github/workflows/uidesign.yml"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build and test UIDesign
        shell: cmd
        run: |
          set "PATH=C:\msys64\ucrt64\bin;%PATH%"
          call apps\UIDesign\test.bat

  # API 注释门禁（纯 Python，不依赖编译器）：覆盖率统计 + 棘轮/新增 API 检查。
  # 见 docs/api-audit/SPEC.md 第 8 节；规则 4（语法编译）在本地 verify_batch.bat 执行。
  api-docs:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: API comment coverage and lint gates
        shell: cmd
        run: |
          python docs\api-audit\tools\api_comment_coverage.py --no-write
          python docs\api-audit\tools\comment_lint.py
